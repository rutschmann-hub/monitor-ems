<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Signage – Verwaltung</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      background: #1a1a2e;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Die Seiten werden in der Google-Tabelle verwaltet (settings.sheetEditUrl in config.js) -->
  <div id="msg">Weiterleitung zur Google-Tabelle …</div>

  <script src="config.js"></script>
  <script>
    const editUrl = window.SIGNAGE_CONFIG?.settings?.sheetEditUrl;
    if (editUrl) {
      location.replace(editUrl);
    } else {
      document.getElementById('msg').innerHTML =
        'Die Seiten werden in der Google-Tabelle verwaltet.<br>' +
        'In <code>config.js</code> ist noch kein Link (<code>sheetEditUrl</code>) eingetragen.';
    }
  </script>
</body>
</html>
