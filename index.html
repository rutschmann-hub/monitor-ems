<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Signage</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

  <!-- Overlay: Uhr -->
  <div id="top-bar">
    <span id="clock"></span>
  </div>

  <!-- Slide-Container: je Folie ein .slide (legt js/signage.js an, bleibt geladen) -->
  <div id="slide-container"></div>

  <!-- Fortschrittsbalken -->
  <div id="progress-bar-wrap">
    <div id="progress-bar"></div>
  </div>

  <!-- Slide-Indikatoren (Punkte) -->
  <div id="dots"></div>

  <!-- Info-Panel (Tastenfolge e m s) – nur Anzeige, geschaltet wird in der Google-Tabelle -->
  <div id="admin-overlay">
    <div id="admin-panel">
      <h2>📺 Aktuelle Seiten</h2>
      <p class="admin-hint"><kbd>e m s</kbd> oder <kbd>Esc</kbd> zum Schließen · Ändern in der Google-Tabelle</p>
      <p class="admin-hint" id="admin-source"></p>
      <div id="admin-slide-list"></div>
      <button id="admin-reload-btn" onclick="adminReload()">🔄 Jetzt neu laden</button>
    </div>
  </div>

  <script src="config.js?v=6"></script>
  <script src="js/signage.js?v=6"></script>
</body>
</html>
